    <!-- Formulario de Contacto -->
    <form class="formulario-contacto" id="formulario-contacto">
      <h2>Contáctame</h2>
      <!--<p class="subtitulo-contacto">Escríbenos o visítanos, responderemos a la brevedad.</p>-->
      
      <div class="grupo-campo">
        <label for="email" class="etiqueta">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tucorreo@gmail.com" class="caja-input" required>
      </div>

      <div class="grupo-campo">
        <label for="asunto" class="etiqueta">Asunto</label>
        <input type="text" id="asunto" name="asunto" placeholder="Motivo de tu mensaje" class="caja-input" required>
      </div>

      <div class="grupo-campo">
        <label for="mensaje" class="etiqueta">Mensaje</label>
        <textarea id="mensaje" name="mensaje" placeholder="Escribe aquí tu mensaje..." class="caja-input area-texto" required></textarea>
      </div>

      <button type="submit" id="btn-enviar" class="boton-enviar">Enviar Mensaje</button>
      <p id="estado-envio" class="estado-envio"></p>
    </form>
  </section>
